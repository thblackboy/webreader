services:
  webreader:
    build: .
    container_name: webreader
    restart: unless-stopped
    networks:
      - openclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"127.0.0.1\",8000)); s.close()'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  openclaw:
    external: true
    name: openclaw_default
